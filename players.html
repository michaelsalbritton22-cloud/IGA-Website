<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>IGA Tour | Players</title>

<style>

body {
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f2;
    color:#222;
}


/* HEADER */

header {
    background:#003b24;
    color:white;
    padding:25px 50px;
}

.logo {
    font-size:36px;
    font-weight:bold;
}

.subtitle {
    font-size:18px;
    margin-top:5px;
}


/* NAV */

nav {
    background:#111;
    padding:15px 50px;
}

nav a {
    color:white;
    text-decoration:none;
    margin-right:25px;
    font-weight:bold;
}


/* PAGE */

.container {
    padding:40px 50px;
}

h1 {
    font-size:42px;
}


/* PLAYER GRID */

.players {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}


/* PLAYER CARD */

.card {
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px #ddd;
}


/* PROFILE IMAGE PLACEHOLDER */

.photo {
    width:100px;
    height:100px;
    border-radius:50%;
    background:#006633;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    margin-bottom:15px;
}


/* RANK */

.rank {
    background:#d4af37;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    display:inline-block;
    font-size:14px;
}


/* STATS */

.stat {
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    padding:8px 0;
}


/* LOADING / ERROR */

.message {
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px #ddd;
}


/* FOOTER */

footer {
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>

</head>

<body>

<header>

```
<div class="logo">
    ⛳ IGA TOUR
</div>

<div class="subtitle">
    Internal Golf Association | Player Directory
</div>
```

</header>

<nav>

```
<a href="index.html">Home</a>

<a href="leaderboard.html">Leaderboard</a>

<a href="players.html">Players</a>

<a href="schedule.html">Schedule</a>

<a href="stats.html">Stats</a>

<a href="championships.html">Championships</a>
```

</nav>

<div class="container">

```
<h1>
    🏌️ IGA Players
</h1>


<div
    class="players"
    id="playersContainer"
>

    <div class="message">
        Loading players...
    </div>

</div>
```

</div>

<footer>

```
IGA Tour © 2027 | Internal Golf Association
```

</footer>

<!-- ==========================================
     SUPABASE
     ========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ==========================================
     DATABASE
     ========================================== -->

<script src="js/database.js"></script>

<script>

// ==========================================
// LOAD PLAYERS
// ==========================================

async function loadPlayersPage() {

    const container =
        document.getElementById(
            "playersContainer"
        );


    try {

        console.log(
            "Loading IGA players..."
        );


        const players =
            await getActivePlayers();


        console.log(
            "Players loaded:",
            players
        );


        // ==================================
        // NO PLAYERS
        // ==================================

        if (
            !players ||
            players.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    <h2>
                        No Active Players
                    </h2>

                    <p>
                        There are currently no
                        active IGA players.
                    </p>

                </div>

            `;

            return;

        }


        // ==================================
        // CLEAR LOADING MESSAGE
        // ==================================

        container.innerHTML = "";


        // ==================================
        // CREATE PLAYER CARDS
        // ==================================

        players.forEach(
            (player, index) => {


                // ------------------------------
                // CREATE INITIALS
                // ------------------------------

                const initials =
                    player.Name
                        .split(" ")
                        .map(
                            part =>
                                part
                                    .charAt(0)
                                    .toUpperCase()
                        )
                        .join("")
                        .substring(
                            0,
                            2
                        );


                // ------------------------------
                // CREATE CARD
                // ------------------------------

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";


                card.innerHTML = `

                    <div class="photo">
                        ${initials}
                    </div>


                    <h2>
                        ${player.Name}
                    </h2>


                    <span class="rank">
                        IGA Player
                    </span>


                    <p>
                        ${player["Home Town"] || "Oklahoma"}
                    </p>


                    <div class="stat">

                        <span>
                            Handicap
                        </span>

                        <b>
                            ${
                                player.Handicap ??
                                "—"
                            }
                        </b>

                    </div>


                    <div class="stat">

                        <span>
                            Player ID
                        </span>

                        <b>
                            ${player.player_id}
                        </b>

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(
            "ERROR LOADING PLAYERS PAGE:",
            error
        );


        container.innerHTML = `

            <div class="message">

                <h2>
                    Error Loading Players
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}


// ==========================================
// START PAGE
// ==========================================

loadPlayersPage();

</script>

</body>

</html>
