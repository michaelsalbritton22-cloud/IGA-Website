<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IGA Tour | Courses</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ==========================================
         SHARED HEADER
         ========================================== -->

    <div id="header"></div>


    <!-- ==========================================
         PAGE
         ========================================== -->

    <div class="container">

        <div class="page-header">

            <div class="section-eyebrow">
                IGA TOUR
            </div>

            <h1>Courses</h1>

            <p>
                The courses that have shaped the IGA Tour.
            </p>

        </div>


        <div id="coursesContainer">

            <div class="message">
                Loading courses...
            </div>

        </div>

    </div>


    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>
        IGA Tour © 2027 | Internal Golf Association
    </footer>


    <!-- ==========================================
         SCRIPTS
         ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/database.js"></script>

    <script src="js/components.js"></script>

    <script>
        loadHeader();
    </script>

    <script>

async function loadCourseEventHistory() {

    try {

        const events =
            await getCourseEventHistory();

        console.log(
            "Course events loaded:",
            events
        );

    }

    catch (error) {

        console.error(
            "ERROR LOADING COURSE EVENTS:",
            error
        );

    }

}

loadCourseEventHistory();

</script>

<script>

async function loadCoursesPage() {

    const container =
        document.getElementById("coursesContainer");

    try {

        console.log("Loading IGA courses...");

        const { data, error } = await supabaseClient
            .from("courses")
            .select("*")
            .order("course_id");

        if (error) {
            throw error;
        }

        console.log("Courses loaded:", data);

        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="message">
                    <h2>No Courses Found</h2>
                    <p>There are currently no courses in the IGA database.</p>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        data.forEach(course => {

            const card =
                document.createElement("div");

            card.className = "course-card";

            card.innerHTML = `

                <div class="course-card-header">

                    <h2>
                        ${course.Course_name || "Course TBD"}
                    </h2>

                    <p>
                        ${course.Location || "Location TBD"}
                    </p>

                </div>

                <div class="course-card-details">

                    <div>
                        <span>PAR</span>
                        <strong>${course.par ?? "—"}</strong>
                    </div>

                    <div>
                        <span>YARDAGE</span>
                        <strong>
                            ${
                                course.yardage
                                    ? Number(course.yardage).toLocaleString()
                                    : "—"
                            }
                        </strong>
                    </div>

                    <div>
                        <span>TEES</span>
                        <strong>${course.tee_name || "—"}</strong>
                    </div>

                    <div>
                        <span>RATING</span>
                        <strong>${course.course_rating ?? "—"}</strong>
                    </div>

                    <div>
                        <span>SLOPE</span>
                        <strong>${course.slope ?? "—"}</strong>
                    </div>

                </div>

            `;

            container.appendChild(card);

        });

    }

    catch (error) {

        console.error(
            "ERROR LOADING COURSES:",
            error
        );

        container.innerHTML = `

            <div class="message">

                <h2>
                    Error Loading Courses
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}

loadCoursesPage();

</script>

</body>

</html>
