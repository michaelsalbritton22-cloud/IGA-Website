<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IGA Tour | Courses</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ==========================================
         SHARED HEADER
         ========================================== -->

    <div id="header"></div>


    <!-- ==========================================
         PAGE
         ========================================== -->

    <div class="container">

        <div class="page-header">

            <div class="section-eyebrow">
                IGA TOUR
            </div>

            <h1>Courses</h1>

            <p>
                The courses that have shaped the IGA Tour.
            </p>

        </div>


        <div id="coursesContainer">

            <div class="message">
                Loading courses...
            </div>

        </div>

    </div>


    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>
        IGA Tour © 2027 | Internal Golf Association
    </footer>


    <!-- ==========================================
         SCRIPTS
         ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/database.js"></script>

    <script src="js/components.js"></script>

    <script>
        loadHeader();
    </script>

    <script>

async function loadCourseEventHistory() {

    try {

        const events =
            await getCourseEventHistory();

        console.log(
            "Course events loaded:",
            events
        );

    }

    catch (error) {

        console.error(
            "ERROR LOADING COURSE EVENTS:",
            error
        );

    }

}

loadCourseEventHistory();

</script>

<script>

async function loadCoursesPage() {

    const container =
    document.getElementById("coursesContainer");

try {

    console.log("Loading IGA courses...");

const events =
    await getCourseEventHistory();

const rounds =
    await getCourseRoundHistory();

const kingHistory =
    await getKingOfTheCourseHistory();  
    
const kingResults =
    await getKingOfTheCourse();

const auditMasterHistory =
    await getAuditMasterChampionHistory();

const folgersHistory =
    await getFolgersChampionHistory();

const { data, error } = await supabaseClient
            .from("courses")
            .select("*")
            .order("course_id");

        if (error) {
            throw error;
        }

        console.log("Courses loaded:", data);

        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="message">
                    <h2>No Courses Found</h2>
                    <p>There are currently no courses in the IGA database.</p>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        data.forEach(course => {

            const card =
                document.createElement("div");

            card.className = "course-card";

            card.innerHTML = `

    <div class="course-card-header">

        <h2>
            ${course.Course_name || "Course TBD"}
        </h2>

        <p>
            ${course.Location || "Location TBD"}
        </p>

    </div>


    <div class="course-card-details">

        <div>
            <span>PAR</span>
            <strong>${course.par ?? "—"}</strong>
        </div>

        <div>
            <span>YARDAGE</span>
            <strong>
                ${
                    course.yardage
                        ? Number(course.yardage).toLocaleString()
                        : "—"
                }
            </strong>
        </div>

        <div>
            <span>TEES</span>
            <strong>${course.tee_name || "—"}</strong>
        </div>

        <div>
            <span>RATING</span>
            <strong>${course.course_rating ?? "—"}</strong>
        </div>

        <div>
            <span>SLOPE</span>
            <strong>${course.slope ?? "—"}</strong>
        </div>

    </div>
    
        <div class="course-events">

        <div class="course-events-title">
            IGA EVENTS
        </div>

        ${
            events
                .filter(
                    event =>
                        event.course_id === course.course_id
                )
                .map(
                    event => `
                        <div class="course-event">
                            <span>
                                ${event.event_name}
                            </span>

                            <strong>
                                ${event.event_type}
                            </strong>
                        </div>
                    `
                )
                .join("")
                ||
                `<div class="course-no-events">
                    No IGA events yet
                </div>`
        }

    </div>

${course.required_rounds > 0 ? `

    <div class="course-kings">

        <div class="course-events-title">
            KING OF THE COURSE
        </div>

        ${
            kingResults
                .filter(
                    king =>
                        king.course_id === course.course_id
                )
                .map(
                    king => `
                        <div class="course-king">

                            <div>
                                <span>
                                    ${king.season_id}
                                </span>

                                <strong>
                                    ${king.player_name}
                                </strong>
                            </div>

                            <strong>
                                ${king.combined_net}
                            </strong>

                        </div>
                    `
                )
                .join("")
                ||
                `<div class="course-no-events">
                    No champion yet
                </div>`
        }

    </div>

` : ""}

${course.course_id === 5 ? `

    <div class="course-kings">

        <div class="course-events-title">
            AUDIT MASTER CHAMPION
        </div>

        ${
            auditMasterHistory
                .filter(
                    champion =>
                        champion.course_id ===
                        course.course_id
                )
                .map(
                    champion => `
                        <div class="course-king">

                            <div>
                                <span>
                                    ${champion.season_id}
                                </span>

                                <strong>
                                    ${champion.player_name}
                                </strong>
                            </div>

                            <strong>
                                ${champion.net_score}
                            </strong>

                        </div>
                    `
                )
                .join("")
                ||
                `<div class="course-no-events">
                    No champion yet
                </div>`
        }

    </div>

` : ""}

${course.course_id === 4 ? `

    <div class="course-kings">

        <div class="course-events-title">
            FOLGER'S REDLINE CLASSIC
        </div>

        ${
            folgersHistory
                .filter(
                    champion =>
                        champion.event_id
                )
                .map(
                    champion => `
                        <div class="course-king">

                            <div>
                                <span>
                                    ${champion.season_id}
                                </span>

                                <strong>
                                    ${champion.team_name}
                                </strong>
                            </div>

                            <strong>
                                ${champion.points}
                            </strong>

                        </div>

                        <div class="course-folgers-players">

                            ${
                                champion.players
                                    .map(
                                        player => `
                                            <div>
                                                ${player}
                                            </div>
                                        `
                                    )
                                    .join("")
                            }

                        </div>
                    `
                )
                .join("")
                ||
                `<div class="course-no-events">
                    No champion yet
                </div>`
        }

    </div>

` : ""}

`;

            container.appendChild(card);

        });

    }

    catch (error) {

        console.error(
            "ERROR LOADING COURSES:",
            error
        );

        container.innerHTML = `

            <div class="message">

                <h2>
                    Error Loading Courses
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}

loadCoursesPage();

</script>

</body>

</html>
