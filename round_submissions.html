<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit a Round | IGA Tour</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>
    <script src="js/components.js"></script>
</head>

<body>

<div id="header"></div>

<main class="container">

    <div class="page-header">
        <div>
            <h1>SUBMIT A ROUND</h1>
            <p class="page-subtitle">
                Submit the scorecard for everyone who played in your group.
            </p>
        </div>
    </div>

    <div id="message"></div>


    <!-- ==========================================
         STEP 1 — ROUND INFORMATION
    =========================================== -->

    <div class="card" id="roundInformationCard">

        <div class="section-header">
            <h2>ROUND INFORMATION</h2>
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label for="event">
                    Event
                </label>

                <select id="event" required>
                    <option value="">
                        Select Event
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="roundDate">
                    Round Date
                </label>

                <input
                    type="date"
                    id="roundDate"
                    required
                >

            </div>


            <div class="form-group">

                <label for="submittedBy">
                    Submitted By
                </label>

                <select id="submittedBy" required>
                    <option value="">
                        Select Your Name
                    </option>
                </select>

            </div>

        </div>


        <div
            id="eventInfo"
            class="event-info"
            style="display:none;"
        >

            <div>
                <strong>Course</strong>
                <span id="courseName">—</span>
            </div>

            <div>
                <strong>Location</strong>
                <span id="courseLocation">—</span>
            </div>

            <div>
                <strong>Par</strong>
                <span id="coursePar">—</span>
            </div>

        </div>

    </div>


    <!-- ==========================================
         STEP 2 — PLAYERS
    =========================================== -->

    <div
        class="card"
        id="playersCard"
        style="display:none;"
    >

        <div class="section-header">

            <h2>WHO PLAYED?</h2>

            <p>
                Select everyone who played in your group.
            </p>

        </div>


        <div
            id="playerSelection"
            class="player-selection"
        ></div>


        <div class="selection-actions">

            <button
                type="button"
                id="selectAllButton"
                class="btn btn-secondary"
            >
                SELECT ALL
            </button>

            <button
                type="button"
                id="clearAllButton"
                class="btn btn-secondary"
            >
                CLEAR
            </button>

        </div>


        <button
            type="button"
            id="continueButton"
            class="btn btn-primary"
        >
            CONTINUE TO SCORECARD
        </button>

    </div>


    <!-- ==========================================
         STEP 3 — SCORECARDS
    =========================================== -->

    <div
        class="card"
        id="scorecardCard"
        style="display:none;"
    >

        <div class="section-header">

            <h2>SCORECARD</h2>

            <p>
                Enter the gross scores and 18Birdies net score for each player.
            </p>

        </div>


        <div id="playerScorecards"></div>


        <div class="form-section">

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    rows="4"
                    placeholder="Optional notes for the commissioner..."
                ></textarea>

            </div>

        </div>


        <div class="form-actions">

            <button
                type="button"
                id="backButton"
                class="btn btn-secondary"
            >
                BACK
            </button>

            <button
                type="button"
                id="submitButton"
                class="btn btn-primary"
            >
                SUBMIT GROUP SCORECARD
            </button>

        </div>

    </div>

</main>


<script>

let players = [];
let events = [];
let selectedEvent = null;
let selectedPlayers = [];
let courseHoles = [];


/* ==========================================
   INITIALIZE
========================================== */

async function initializePage() {

    try {

        await loadPlayers();
        await loadEvents();

        const params =
            new URLSearchParams(window.location.search);

        const eventId =
            params.get("event");

        if (eventId) {

            document.getElementById("event").value =
                eventId;

            await handleEventChange();

        }

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to load the submission page.",
            "error"
        );

    }

}


/* ==========================================
   LOAD PLAYERS
========================================== */

async function loadPlayers() {

    players = await getActivePlayers();

    const submittedBy =
        document.getElementById("submittedBy");

    submittedBy.innerHTML = `
        <option value="">
            Select Your Name
        </option>
    `;


    players.forEach(player => {

        const option =
            document.createElement("option");

        option.value =
            player.player_id;

        option.textContent =
            player.Name;

        submittedBy.appendChild(option);

    });


    renderPlayerSelection();

}


/* ==========================================
   PLAYER SELECTION
========================================== */

function renderPlayerSelection() {

    const container =
        document.getElementById("playerSelection");

    container.innerHTML = "";


    players.forEach(player => {

        const label =
            document.createElement("label");

        label.className =
            "player-checkbox";


        label.innerHTML = `

            <input
                type="checkbox"
                class="player-select"
                value="${player.player_id}"
            >

            <span>
                ${escapeHtml(player.Name)}
            </span>

        `;


        container.appendChild(label);

    });


    document
        .querySelectorAll(".player-select")
        .forEach(checkbox => {

            checkbox.addEventListener(
                "change",
                updateSelectedPlayers
            );

        });

}


/* ==========================================
   UPDATE SELECTED PLAYERS
========================================== */

function updateSelectedPlayers() {

    selectedPlayers =
        Array.from(
            document.querySelectorAll(
                ".player-select:checked"
            )
        ).map(
            checkbox => Number(checkbox.value)
        );

}


/* ==========================================
   SELECT ALL
========================================== */

document
    .getElementById("selectAllButton")
    .addEventListener("click", () => {

        document
            .querySelectorAll(".player-select")
            .forEach(checkbox => {

                checkbox.checked = true;

            });

        updateSelectedPlayers();

    });


/* ==========================================
   CLEAR ALL
========================================== */

document
    .getElementById("clearAllButton")
    .addEventListener("click", () => {

        document
            .querySelectorAll(".player-select")
            .forEach(checkbox => {

                checkbox.checked = false;

            });

        updateSelectedPlayers();

    });


/* ==========================================
   LOAD EVENTS
========================================== */

async function loadEvents() {

    events = await getOpenEvents();

    const select =
        document.getElementById("event");

    select.innerHTML = `
        <option value="">
            Select Event
        </option>
    `;


    events.forEach(event => {

        const option =
            document.createElement("option");

        option.value =
            event.id;

        option.textContent =
            event.event_name;

        select.appendChild(option);

    });

}


/* ==========================================
   EVENT CHANGE
========================================== */

document
    .getElementById("event")
    .addEventListener(
        "change",
        handleEventChange
    );


async function handleEventChange() {

    const eventId =
        Number(
            document.getElementById("event").value
        );


    if (!eventId) {

        selectedEvent = null;

        document
            .getElementById("eventInfo")
            .style.display = "none";

        document
            .getElementById("playersCard")
            .style.display = "none";

        return;

    }


    selectedEvent =
        events.find(
            event =>
                Number(event.id) === eventId
        );


    if (!selectedEvent) {

        showMessage(
            "Unable to find the selected event.",
            "error"
        );

        return;

    }


    /* DATE */

    if (selectedEvent.event_date) {

        document
            .getElementById("roundDate")
            .value =
            selectedEvent.event_date.substring(0, 10);

    }


    /* COURSE INFORMATION */

    const course =
        selectedEvent.courses;


    document
        .getElementById("courseName")
        .textContent =
        course?.Course_name ||
        "—";


    document
        .getElementById("courseLocation")
        .textContent =
        course?.Location ||
        course?.location ||
        course?.City ||
        course?.city ||
        "—";


    document
        .getElementById("coursePar")
        .textContent =
        course?.Par ||
        course?.par ||
        "—";


    document
        .getElementById("eventInfo")
        .style.display = "grid";


    /* LOAD HOLES */

    try {

        courseHoles =
            await getCourseHoles(
                selectedEvent.course_id
            );

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to load the course scorecard.",
            "error"
        );

        return;

    }


    document
        .getElementById("playersCard")
        .style.display = "block";


    document
        .getElementById("playersCard")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}


/* ==========================================
   CONTINUE TO SCORECARD
========================================== */

document
    .getElementById("continueButton")
    .addEventListener(
        "click",
        continueToScorecard
    );


function continueToScorecard() {

    clearMessage();

    updateSelectedPlayers();


    if (!selectedEvent) {

        showMessage(
            "Please select an event.",
            "error"
        );

        return;

    }


    if (!document.getElementById("submittedBy").value) {

        showMessage(
            "Please select who is submitting the scorecard.",
            "error"
        );

        return;

    }


    if (selectedPlayers.length === 0) {

        showMessage(
            "Please select at least one player who played.",
            "error"
        );

        return;

    }


    const submittedBy =
        Number(
            document.getElementById("submittedBy").value
        );


    /*
     * The person submitting the scorecard should
     * normally be included among the players.
     */

    if (!selectedPlayers.includes(submittedBy)) {

        const submitter =
            players.find(
                p =>
                    Number(p.player_id) === submittedBy
            );


        const addSubmitter =
            confirm(
                `${submitter?.Name || "The selected submitter"} is not currently selected as a player. Add them to the group?`
            );


        if (addSubmitter) {

            selectedPlayers.push(submittedBy);

            const checkbox =
                document.querySelector(
                    `.player-select[value="${submittedBy}"]`
                );

            if (checkbox) {

                checkbox.checked = true;

            }

        }

    }


    renderPlayerScorecards();


    document
        .getElementById("scorecardCard")
        .style.display = "block";


    document
        .getElementById("scorecardCard")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}


/* ==========================================
   RENDER PLAYER SCORECARDS
========================================== */

function renderPlayerScorecards() {

    const container =
        document.getElementById("playerScorecards");

    container.innerHTML = "";


    selectedPlayers.forEach(playerId => {

        const player =
            players.find(
                p =>
                    Number(p.player_id) ===
                    Number(playerId)
            );


        if (!player) return;


        const card =
            document.createElement("div");

        card.className =
            "player-scorecard";


        const handicap =
            player.Handicap !== null &&
            player.Handicap !== undefined
                ? Number(player.Handicap)
                : "";


        card.innerHTML = `

            <div class="player-scorecard-header">

                <div>

                    <h3>
                        ${escapeHtml(player.Name)}
                    </h3>

                    <span>
                        Handicap: ${
                            handicap !== ""
                                ? handicap.toFixed(1)
                                : "Enter below"
                        }
                    </span>

                </div>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Handicap Used
                    </label>

                    <input
                        type="number"
                        class="player-handicap"
                        data-player="${playerId}"
                        value="${handicap}"
                        min="0"
                        max="54"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        18Birdies Net Score
                    </label>

                    <input
                        type="number"
                        class="player-net"
                        data-player="${playerId}"
                        min="1"
                        max="150"
                        step="1"
                        required
                    >

                </div>

            </div>


            <div class="scorecard-wrapper">

                <table class="scorecard">

                    <thead>

                        <tr>
                            <th>Hole</th>
                            <th>Par</th>
                            <th>HCP</th>
                            <th>Gross</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${courseHoles.map(hole => `

                            <tr>

                                <td>
                                    ${hole.hole_number}
                                </td>

                                <td>
                                    ${hole.par}
                                </td>

                                <td>
                                    ${hole.handicap_index}
                                </td>

                                <td>

                                    <input
                                        type="number"
                                        class="hole-score"
                                        data-player="${playerId}"
                                        data-hole="${hole.hole_number}"
                                        min="1"
                                        max="20"
                                        step="1"
                                        inputmode="numeric"
                                        required
                                    >

                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                    <tfoot>

                        <tr>

                            <th colspan="3">
                                Gross Total
                            </th>

                            <th
                                class="gross-total"
                                data-player="${playerId}"
                            >
                                0
                            </th>

                        </tr>

                    </tfoot>

                </table>

            </div>

        `;


        container.appendChild(card);

    });


    document
        .querySelectorAll(".hole-score")
        .forEach(input => {

            input.addEventListener(
                "input",
                updatePlayerGrossTotal
            );

        });

}


/* ==========================================
   GROSS TOTAL
========================================== */

function updatePlayerGrossTotal(event) {

    const playerId =
        event.target.dataset.player;


    let total = 0;


    document
        .querySelectorAll(
            `.hole-score[data-player="${playerId}"]`
        )
        .forEach(input => {

            const score =
                Number(input.value);


            if (
                Number.isFinite(score)
            ) {

                total += score;

            }

        });


    const totalElement =
        document.querySelector(
            `.gross-total[data-player="${playerId}"]`
        );


    if (totalElement) {

        totalElement.textContent =
            total;

    }

}


/* ==========================================
   BACK
========================================== */

document
    .getElementById("backButton")
    .addEventListener("click", () => {

        document
            .getElementById("scorecardCard")
            .style.display = "none";

        window.scrollTo({
            top: document
                .getElementById("playersCard")
                .offsetTop - 20,
            behavior: "smooth"
        });

    });


/* ==========================================
   SUBMIT
========================================== */

document
    .getElementById("submitButton")
    .addEventListener(
        "click",
        submitGroupScorecard
    );


async function submitGroupScorecard() {

    clearMessage();


    const button =
        document.getElementById("submitButton");


    button.disabled = true;
    button.textContent = "SUBMITTING...";


    try {

        if (!selectedEvent) {

            throw new Error(
                "Please select an event."
            );

        }


        const submittedBy =
            Number(
                document.getElementById("submittedBy").value
            );


        if (!submittedBy) {

            throw new Error(
                "Please select who is submitting the scorecard."
            );

        }


        const roundDate =
            document.getElementById("roundDate").value;


        if (!roundDate) {

            throw new Error(
                "Please enter the round date."
            );

        }


        if (selectedPlayers.length === 0) {

            throw new Error(
                "Please select at least one player."
            );

        }


        /*
         * Generate one ID for the entire group submission.
         */

        const submissionGroupId =
            crypto.randomUUID();


        /*
         * Determine round number from event name.
         */

        let roundNumber = 1;


        const roundMatch =
            selectedEvent.event_name?.match(
                /Round\s+(\d+)/i
            );


        if (roundMatch) {

            roundNumber =
                Number(roundMatch[1]);

        }


        const notes =
            document
                .getElementById("notes")
                .value
                .trim();


        const submissions = [];


        /*
         * Build one submission for every player.
         */

        for (const playerId of selectedPlayers) {

            const player =
                players.find(
                    p =>
                        Number(p.player_id) ===
                        Number(playerId)
                );


            if (!player) {

                throw new Error(
                    "Unable to find one of the selected players."
                );

            }


            /* HANDICAP */

            const handicapInput =
                document.querySelector(
                    `.player-handicap[data-player="${playerId}"]`
                );


            const handicapUsed =
                Number(handicapInput?.value);


            if (
                !Number.isFinite(handicapUsed) ||
                handicapUsed < 0 ||
                handicapUsed > 54
            ) {

                throw new Error(
                    `Please enter a valid handicap for ${player.Name}.`
                );

            }


            /* NET */

            const netInput =
                document.querySelector(
                    `.player-net[data-player="${playerId}"]`
                );


            const netScore =
                Number(netInput?.value);


            if (
                !Number.isInteger(netScore) ||
                netScore < 1 ||
                netScore > 150
            ) {

                throw new Error(
                    `Please enter a valid 18Birdies net score for ${player.Name}.`
                );

            }


            /* GROSS */

            const scoreInputs =
                Array.from(
                    document.querySelectorAll(
                        `.hole-score[data-player="${playerId}"]`
                    )
                );


            if (scoreInputs.length !== 18) {

                throw new Error(
                    `The scorecard for ${player.Name} does not contain 18 holes.`
                );

            }


            const grossScores =
                scoreInputs.map(input => {

                    const score =
                        Number(input.value);


                    if (
                        !Number.isInteger(score) ||
                        score < 1 ||
                        score > 20
                    ) {

                        throw new Error(
                            `Please enter a valid score for ${player.Name}, hole ${input.dataset.hole}.`
                        );

                    }


                    return score;

                });


           submissions.push({

    event_id:
        Number(selectedEvent.id),

    round_number:
        roundNumber,

    submitted_by:
        submittedBy,

    player_id:
        Number(playerId),

    submitted_at:
        new Date().toISOString(),

    status:
        "Pending",

    notes:
        notes || null,

    round_date:
        roundDate,

    handicap_used:
        handicapUsed,

    net_score:
        netScore,

    gross_scores:
        grossScores,

    submission_group_id:
        submissionGroupId

});

        }

        /*
         * Check for existing official rounds.
         */

        for (const submission of submissions) {

            const { data: existingRounds, error } =
                await supabaseClient
                    .from("rounds")
                    .select("id")
                    .eq(
                        "event_id",
                        submission.event_id
                    )
                    .eq(
                        "player_id",
                        submission.player_id
)
                    .limit(1);


            if (error) {

                throw error;

            }


            if (
                existingRounds &&
                existingRounds.length > 0
            ) {

                const player =
                    players.find(
                        p =>
                            Number(p.player_id) ===
                            Number(
                                submission.submitted_player_id
                            )
                    );


                throw new Error(
                    `${player?.Name || "A selected player"} already has an official round for this event.`
                );

            }

        }


        /*
         * Check for existing active submissions.
         */

        for (const submission of submissions) {

            const { data: existingSubmissions, error } =
                await supabaseClient
                    .from("round_submissions")
                    .select("id, status")
                    .eq(
                        "event_id",
                        submission.event_id
                    )
                    .eq(
                        "player_id",
                        submission.player_id
                    )
                    .in(
                        "status",
                        [
                            "Pending",
                            "Matched",
                            "Discrepancy",
                            "Approved"
                        ]
                    )
                    .limit(1);


            if (error) {

                throw error;

            }


            if (
                existingSubmissions &&
                existingSubmissions.length > 0
            ) {

                const player =
                    players.find(
                        p =>
                            Number(p.player_id) ===
                            Number(
                                submission.player_id
                            )
                    );


                throw new Error(
                    `${player?.Name || "A selected player"} already has a submission awaiting review.`
                );

            }

        }


        /*
         * The database column "submitted_by" identifies
         * who entered the scorecard.
         *
         * The actual player needs its own column.
         */

        const rows = submissions;


        const { data, error } =
            await supabaseClient
                .from("round_submissions")
                .insert(rows)
                .select();


        if (error) {

            throw error;

        }


        console.log(
            "Group submission created:",
            data
        );


        /*
         * SUCCESS
         */

        document
            .getElementById("scorecardCard")
            .style.display = "none";

        document
            .getElementById("playersCard")
            .style.display = "none";

        showMessage(
            `
            <strong>Scorecard submitted successfully.</strong>
            <br><br>
            ${selectedPlayers.length} player
            ${selectedPlayers.length === 1 ? "score has" : "scores have"}
            been submitted for commissioner review.
            <br><br>
            Status: <strong>PENDING</strong>
            `,
            "success"
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(
            "Group submission error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to submit the scorecard.",
            "error"
        );


    } finally {

        button.disabled = false;
        button.textContent =
            "SUBMIT GROUP SCORECARD";

    }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(message, type) {

    document
        .getElementById("message")
        .innerHTML = `

            <div class="alert alert-${type}">
                ${message}
            </div>

        `;

}


function clearMessage() {

    document
        .getElementById("message")
        .innerHTML = "";

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ==========================================
   START
========================================== */

initializePage();

</script>


<style>

.form-section {
    margin-bottom: 30px;
}

.section-header {
    margin-bottom: 20px;
}

.section-header h2 {
    margin-bottom: 6px;
}

.section-header p {
    color: #666;
    margin: 0;
}

.form-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    box-sizing: border-box;
}

.event-info {
    margin-top: 20px;
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 8px;
}

.event-info div {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.event-info span {
    font-weight: 600;
}

.player-selection {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.player-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
}

.player-checkbox:hover {
    background: #f5f5f5;
}

.player-checkbox input {
    width: 18px;
    height: 18px;
}

.selection-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.player-scorecard {
    border-top: 2px solid #ddd;
    padding: 25px 0;
    margin-bottom: 25px;
}

.player-scorecard:first-child {
    border-top: none;
    padding-top: 0;
}

.player-scorecard-header {
    margin-bottom: 20px;
}

.player-scorecard-header h3 {
    margin: 0 0 5px;
}

.player-scorecard-header span {
    color: #666;
}

.scorecard-wrapper {
    overflow-x: auto;
}

.scorecard {
    width: 100%;
    border-collapse: collapse;
}

.scorecard th,
.scorecard td {
    padding: 9px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

.scorecard th {
    font-weight: 700;
}

.hole-score {
    width: 65px;
    padding: 8px;
    text-align: center;
    font-size: 16px;
}

.gross-total {
    font-weight: 700;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 30px;
}

.alert {
    padding: 15px 18px;
    margin-bottom: 20px;
    border-radius: 8px;
}

.alert-success {
    background: #e8f5e9;
    border: 1px solid #81c784;
}

.alert-error {
    background: #ffebee;
    border: 1px solid #e57373;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

@media (max-width: 600px) {

    .form-actions,
    .selection-actions {
        flex-direction: column;
    }

    .form-actions button,
    .selection-actions button {
        width: 100%;
    }

}

</style>

</body>
</html>
